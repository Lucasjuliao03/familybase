<!doctype html>
<html lang="en">
  <head>
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="../../icon/fav/favicon-96x96.png"
    />
    <link
      rel="icon"
      href="../../icon/fav/favicon.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link rel="icon" href="../../icon/fav/favicon.ico" />
    <link rel="apple-touch-icon" href="../../icon/fav/apple-touch-icon.png" />
    <link rel="manifest" href="../../icon/fav/site.webmanifest" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f172a"
      media="(prefers-color-scheme: dark)"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email verified | Tudo de Família</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f6f8fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        padding: 44px 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #e5e9f0;
        border-radius: 20px;
        box-shadow: 0 14px 40px rgba(23, 32, 51, 0.08);
      }

      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #16845b;
        background: #e6f7ef;
        font-size: 36px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: #596579;
        line-height: 1.6;
      }
      .welcome {
        margin-top: 12px;
        color: #172033;
        font-size: 17px;
      }

      .translation {
        margin-top: 10px;
        color: #76829a;
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main role="main">
      <div class="icon" aria-label="Verified">✓</div>
      <h1>Email verified successfully</h1>
      <p>Your email address has been confirmed.</p>
      <p class="welcome">
        Welcome to Tudo de Família!<br />Your account is ready to use. <br />You
        can now log in and start using the app.
      </p>
      <p class="translation">
        Bem-vindo(a) ao Tudo de Família!<br />Sua conta está pronta para uso.<br />Agora
        você pode fazer login e começar a usar o aplicativo.
      </p>
    </main>
  </body>
</html>
